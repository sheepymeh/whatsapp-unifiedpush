name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, '[release ')
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Read release version
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          title="${COMMIT_MESSAGE%%$'\n'*}"
          if [[ ! "$title" =~ ^\[release\ ([0-9]+\.[0-9]+\.[0-9]+)\] ]]; then
            echo 'Expected first line: [release 0.1.0]' >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          tag="$version"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-android
        id: android
        with:
          build-type: release
          version: ${{ steps.version.outputs.version }}
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          version-code: ${{ github.run_number }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name release APK
        run: |
          mkdir -p dist
          cp "${{ steps.android.outputs.apk-path }}" "dist/whatsapp-unifiedpush-${{ steps.version.outputs.tag }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: whatsapp-unifiedpush-release
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

      - uses: ./.github/actions/build-server
        with:
          push: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "WhatsApp UnifiedPush ${{ steps.version.outputs.tag }}" \
            --generate-notes
