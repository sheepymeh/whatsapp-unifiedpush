name: Build Android APK
description: Build a debug APK or a signed release APK

inputs:
  build-type:
    description: debug or release
    required: true
  gradle-cache-encryption-key:
    description: Encryption key for Gradle cache
    required: true
  version:
    description: Release version
    required: false
    default: ''
  version-code:
    description: Integer Android version code
    required: false
    default: ''
  keystore-base64:
    description: Base64-encoded signing keystore
    required: false
  keystore-password:
    description: Keystore password
    required: false
  key-alias:
    description: Key alias
    required: false
  key-password:
    description: Key password
    required: false

outputs:
  apk-path:
    description: Path to the generated APK
    value: ${{ steps.apk.outputs.path }}

runs:
  using: composite
  steps:
    - name: Validate build-type
      shell: sh
      if: inputs.build-type != 'debug' && inputs.build-type != 'release'
      run: |
        echo "Invalid build-type: ${{ inputs.build-type }}" >&2
        exit 1

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 25
    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: 9.8.1
        cache-encryption-key: ${{ inputs.gradle-cache-encryption-key }}

    - name: Restore signing key
      if: inputs.build-type == 'release'
      shell: bash
      env:
        KEYSTORE: ${{ inputs.keystore-base64 }}
      run: |
        : "${KEYSTORE:?Missing signing keystore}"
        umask 077
        printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
        echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

    - name: Build APK
      shell: bash
      working-directory: app
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_VERSION_CODE: ${{ inputs.version-code }}
        ANDROID_KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        ANDROID_KEY_ALIAS: ${{ inputs.key-alias }}
        ANDROID_KEY_PASSWORD: ${{ inputs.key-password }}
      run: |
        case "${{ inputs.build-type }}" in
          debug) gradle --no-daemon assembleDebug ;;
          release)
            : "${RELEASE_VERSION:?Missing release version}"
            : "${RELEASE_VERSION_CODE:?Missing version code}"
            : "${ANDROID_KEYSTORE_PASSWORD:?Missing keystore password}"
            : "${ANDROID_KEY_ALIAS:?Missing key alias}"
            : "${ANDROID_KEY_PASSWORD:?Missing key password}"
            gradle --no-daemon assembleRelease
            ;;
          *) echo "Invalid build type: ${{ inputs.build-type }}" >&2; exit 1 ;;
        esac

    - name: Remove signing key
      if: always() && inputs.build-type == 'release'
      shell: sh
      run: rm -f "$RUNNER_TEMP/release.jks"

    - name: Locate APK
      id: apk
      shell: sh
      run: |
        path="app/build/outputs/apk/${{ inputs.build-type }}/WhatsAppUnifiedPush-${{ inputs.build-type }}.apk"
        test -f "$path"
        echo "path=$path" >> "$GITHUB_OUTPUT"
