name: Build server image
description: Build and optionally publish a cached GHCR image

inputs:
  tags:
    description: docker/metadata-action tag rules
    required: true
  push:
    description: Publish to GHCR
    required: false
  token:
    description: GitHub token for GHCR authentication
    required: false

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      if: inputs.push == 'true'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - uses: docker/metadata-action@v6
      id: meta
      with:
        images: ghcr.io/${{ github.repository }}
        tags: ${{ inputs.tags }}
    - uses: docker/build-push-action@v7
      with:
        context: ./server
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=wa-wake
        cache-to: ${{ inputs.push == 'true' && 'type=gha,scope=wa-wake,mode=max' || '' }}
